# Publish only the prepared static gallery; recording/model calls never run in CI.
name: Scenario gallery Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/gallery-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy gallery
        id: deploy
        uses: actions/deploy-pages@v4
